<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduTip 2026 | Školské tipovanie známok</title>
  <link rel="icon" type="image/png" href="/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="landing-page">

  <!-- Animated Background -->
  <div class="bg-animation">
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>
    <div class="floating-shapes">
      <div class="shape shape-1">🎯</div>
      <div class="shape shape-2">📚</div>
      <div class="shape shape-3">🎓</div>
      <div class="shape shape-4">⭐</div>
      <div class="shape shape-5">🏆</div>
      <div class="shape shape-6">📝</div>
    </div>
    <div class="glow-orbs">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="landing-container">
    <!-- Hero Section -->
    <div class="hero">
      <div class="hero-logo-box anim-fade-down" style="margin-bottom: 1.2rem; display: flex; justify-content: center;">
        <img src="/img/logo.png" alt="EduTip Logo" style="width: 120px; height: 120px; border-radius: 50%; filter: drop-shadow(0 0 30px rgba(124, 58, 237, 0.6));">
      </div>
      <div class="hero-badge anim-fade-down">
        <span class="badge-dot"></span>
        Školská tipovacia platforma · 2026
      </div>
      <h1 class="hero-title anim-fade-up">
        <span class="gradient-text">EduTip</span> <span style="font-size: 0.55em; color: #06b6d4; font-weight: 800; vertical-align: super; background: rgba(6,182,212,0.15); padding: 3px 12px; border-radius: 12px; border: 1px solid rgba(6,182,212,0.3);">2026</span>
      </h1>
      <p class="hero-subtitle anim-fade-up anim-delay-1">
        Tipuj aké známky dostanú tvoji spolužiaci.<br>
        Ukáž, že ich poznáš najlepšie, a vyhrávaj body!
      </p>
      <div class="hero-stats anim-fade-up anim-delay-2">
        <div class="hero-stat">
          <span class="hero-stat-icon">👥</span>
          <span class="hero-stat-label">Registruj sa</span>
        </div>
        <div class="hero-stat-divider"></div>
        <div class="hero-stat">
          <span class="hero-stat-icon">🎯</span>
          <span class="hero-stat-label">Tipuj známky</span>
        </div>
        <div class="hero-stat-divider"></div>
        <div class="hero-stat">
          <span class="hero-stat-icon">🏆</span>
          <span class="hero-stat-label">Vyhrávaj</span>
        </div>
      </div>
    </div>

    <!-- Auth Card -->
    <div class="auth-wrapper anim-fade-up anim-delay-3">
      <div class="auth-card glass-card">
        <!-- Auth Header with Logo & 2026 -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem; padding-bottom: 0.8rem; border-bottom: 1px solid var(--border);">
          <div style="display: flex; align-items: center; gap: 10px;">
            <img src="/img/logo.png" alt="EduTip" style="width: 36px; height: 36px; border-radius: 50%;">
            <span style="font-weight: 800; font-size: 1.15rem; background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">EduTip</span>
          </div>
          <span style="font-size: 0.8rem; font-weight: 700; color: #06b6d4; background: rgba(6,182,212,0.12); border: 1px solid rgba(6,182,212,0.25); padding: 3px 10px; border-radius: 999px;">
            SEZÓNA 2026
          </span>
        </div>

        <!-- Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Prihlásenie (2026)</button>
          <button class="auth-tab" data-tab="register">Registrácia (2026)</button>
          <div class="tab-slider"></div>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form active">
          <div class="form-group">
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <input type="text" id="loginUsername" placeholder="Prezývka" required autocomplete="username">
            </div>
          </div>
          <div class="form-group">
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input type="password" id="loginPassword" placeholder="Heslo" required autocomplete="current-password">
            </div>
          </div>
          <button type="submit" class="btn btn-primary">
            <span>Prihlásiť sa</span>
            <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" class="auth-form">
          <div class="form-row">
            <div class="form-group">
              <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
                <input type="text" id="regMeno" placeholder="Meno" required autocapitalize="words">
              </div>
            </div>
            <div class="form-group">
              <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
                <input type="text" id="regPriezvisko" placeholder="Priezvisko" required autocapitalize="words">
              </div>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                  <line x1="16" y1="2" x2="16" y2="6"/>
                  <line x1="8" y1="2" x2="8" y2="6"/>
                  <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                <input type="date" id="regDatum" required>
              </div>
              <span class="input-hint">Dátum narodenia</span>
            </div>
            <div class="form-group">
              <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                  <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                </svg>
                <select id="regTrieda" class="form-select" required style="padding-left: 44px;">
                  <option value="">Vyber triedu...</option>
                  <optgroup label="1. ročník">
                    <option value="1.A">1.A</option>
                    <option value="1.B">1.B</option>
                    <option value="1.C">1.C</option>
                    <option value="1.D">1.D</option>
                    <option value="1.E">1.E</option>
                  </optgroup>
                  <optgroup label="2. ročník">
                    <option value="2.A">2.A</option>
                    <option value="2.B">2.B</option>
                    <option value="2.C">2.C</option>
                    <option value="2.D">2.D</option>
                    <option value="2.E">2.E</option>
                  </optgroup>
                  <optgroup label="3. ročník">
                    <option value="3.A">3.A</option>
                    <option value="3.B">3.B</option>
                    <option value="3.C">3.C</option>
                    <option value="3.D" selected>3.D</option>
                    <option value="3.E">3.E</option>
                  </optgroup>
                  <optgroup label="4. ročník">
                    <option value="4.A">4.A</option>
                    <option value="4.B">4.B</option>
                    <option value="4.C">4.C</option>
                    <option value="4.D">4.D</option>
                    <option value="4.E">4.E</option>
                  </optgroup>
                </select>
              </div>
            </div>
          </div>
          <div class="form-group">
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <input type="text" id="regUsername" placeholder="Prezývka (na prihlásenie)" required autocomplete="username">
            </div>
          </div>
          <div class="form-group">
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input type="password" id="regPassword" placeholder="Heslo (min. 4 znaky)" required autocomplete="new-password">
            </div>
          </div>
          <button type="submit" class="btn btn-primary">
            <span>Vytvoriť účet</span>
            <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </form>

        <!-- Error message -->
        <div id="authError" class="auth-error"></div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="landing-footer anim-fade-up anim-delay-4">
      <p>🎓 EduTip &copy; 2026 — Školské tipovanie</p>
    </footer>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer"></div>

  <script src="/js/app.js?v=2"></script>
</body>
</html>
